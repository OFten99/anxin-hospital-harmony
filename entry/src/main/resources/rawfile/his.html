<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>线上挂号 · 医院门诊系统</title>
<style>
  /* 视觉规范取自医院管理系统 static/style.css：
     背景 #f4f4f5 / 面板 #fff / 正文 #18181b / 次要 #71717a / 分割线 #e4e4e7
     强调色即黑色，面板圆角 18px，按钮与输入框圆角 10px，徽章全圆角 */
  :root{
    --bg:#f4f4f5; --panel:#ffffff; --ink:#18181b; --muted:#71717a;
    --rule:#e4e4e7; --accent:#18181b; --accent-dark:#000000;
    --shadow:0 16px 38px rgba(24,24,27,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;line-height:1.6;
    -webkit-text-size-adjust:100%}

  /* 顶栏沿用后台侧边栏的黑底身份感 */
  .topbar{position:sticky;top:0;z-index:10;background:#111111;color:#f9fafb;
    padding:14px 18px;display:flex;align-items:center;gap:12px}
  .brand-mark{width:38px;height:38px;border-radius:12px;background:#18181b;
    border:1px solid rgba(255,255,255,.18);display:flex;align-items:center;
    justify-content:center;font-size:22px;font-weight:800;line-height:1;flex:0 0 auto}
  .brand-text{flex:1 1 auto;min-width:0}
  .brand-text strong{display:block;font-size:17px;font-weight:700;letter-spacing:.5px}
  .brand-text span{display:block;color:#a1a1aa;font-size:13px;margin-top:1px}
  .step-pill{flex:0 0 auto;background:rgba(255,255,255,.1);color:#e4e4e7;
    border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700}

  main{padding:16px 14px 34px}
  .wrap{max-width:720px;margin:0 auto}

  /* 进度条 */
  .steps{display:flex;gap:6px;margin:0 0 16px}
  .steps i{height:4px;flex:1 1 0;border-radius:999px;background:#e4e4e7}
  .steps i.on{background:var(--accent)}

  .section-tip{color:var(--muted);font-size:14px;margin:0 0 12px}

  .card{background:var(--panel);border:1px solid var(--rule);border-radius:18px;
    box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
  .card.tap{cursor:pointer;transition:transform .08s ease}
  .card.tap:active{transform:scale(.985)}
  .row{display:flex;align-items:flex-start;gap:10px}
  .row .grow{flex:1 1 auto;min-width:0}
  .name{font-size:19px;font-weight:700;line-height:1.35;margin:0}
  .meta{color:var(--muted);font-size:14.5px;margin:5px 0 0;word-break:break-all}
  .price{font-size:17px;font-weight:700;white-space:nowrap}

  .badge{display:inline-block;padding:3px 9px;border-radius:999px;
    background:#e4e4e7;color:#27272a;font-size:13px;font-weight:700}
  .badge.dark{background:var(--accent);color:#fff}
  .badge.line{background:#fff;border:1px solid var(--rule);color:#3f3f46}

  button,.btn{border:0;border-radius:10px;padding:13px 16px;background:var(--accent);
    color:#fff;font:inherit;font-weight:700;font-size:17px;display:block;width:100%;
    cursor:pointer}
  button:active{background:var(--accent-dark)}
  button[disabled]{background:#d4d4d8;color:#71717a}
  .btn-ghost{background:#e4e4e7;color:#27272a}
  .btn-ghost:active{background:#d4d4d8}

  .field{margin-bottom:13px}
  .field label{display:block;font-size:14px;color:var(--muted);margin-bottom:6px;font-weight:700}
  .field label em{color:#b91c1c;font-style:normal}
  input,select{width:100%;border:1px solid var(--rule);border-radius:10px;
    padding:12px 13px;font:inherit;font-size:17px;background:#fff;color:var(--ink)}
  input:focus,select:focus{outline:2px solid #a1a1aa;border-color:var(--accent)}

  .flash{border-radius:12px;padding:12px 14px;border:1px solid var(--rule);
    background:#fff;font-size:15px;margin-bottom:14px}
  .flash.err{border-color:#fecaca;background:#fef2f2;color:#991b1b}
  .flash.ok{border-color:#d4d4d8;background:#fafafa;color:#3f3f46}

  .kv{display:flex;justify-content:space-between;gap:12px;padding:9px 0;
    border-bottom:1px solid var(--rule);font-size:15.5px}
  .kv:last-child{border-bottom:0}
  .kv b{font-weight:700}
  .kv span{color:var(--muted)}

  .skeleton{height:76px;border-radius:18px;background:#e9e9ec;margin-bottom:12px;
    animation:pulse 1.2s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}

  .foot{color:#a1a1aa;font-size:12.5px;text-align:center;margin-top:18px;line-height:1.7}
  .center{text-align:center}
  .big-code{font-size:30px;font-weight:800;letter-spacing:2px;margin:6px 0 0}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand-mark">+</div>
  <div class="brand-text">
    <strong>医院门诊系统</strong>
    <span>线上挂号 · 门诊信息管理端</span>
  </div>
  <div class="step-pill" id="stepPill">选科室</div>
</header>

<main>
  <div class="wrap">
    <div class="steps" id="steps">
      <i></i><i></i><i></i><i></i>
    </div>
    <div id="app"></div>
    <div class="foot">本页数据来自医院门诊管理系统实时接口<br>挂号结果会写入医院数据库</div>
  </div>
</main>

<script>
(function () {
  "use strict";

  // ── 运行时状态 ──────────────────────────────────────────
  var BASE = "";           // 后端地址，由鸿蒙侧 initPage 注入
  var S = { dept: null, doctor: null, schedule: null };
  var appEl = document.getElementById("app");
  var stepEl = document.getElementById("steps");
  var pillEl = document.getElementById("stepPill");
  var STEPS = ["选科室", "选医生", "选时段", "填信息", "完成"];

  function setStep(n) {
    var dots = stepEl.getElementsByTagName("i");
    for (var i = 0; i < dots.length; i++) {
      dots[i].className = i < n ? "on" : "";
    }
    pillEl.textContent = STEPS[Math.min(n, STEPS.length - 1)];
  }

  function esc(s) {
    return String(s === null || s === undefined ? "" : s)
      .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
  }

  function money(v) {
    if (v === null || v === undefined || v === "") { return ""; }
    var n = Number(v);
    return isNaN(n) ? String(v) : "¥" + n.toFixed(2);
  }

  // ── 接口封装 ────────────────────────────────────────────
  function api(path, options) {
    var url = BASE + path;
    return fetch(url, options).then(function (res) {
      return res.text().then(function (text) {
        var body;
        try { body = JSON.parse(text); }
        catch (e) {
          throw new Error("接口返回的不是 JSON。请确认后端地址正确（当前：" + BASE + "）");
        }
        if (!body || body.code !== 0) {
          throw new Error((body && body.msg) || "请求失败");
        }
        return body;
      });
    });
  }

  function fail(msg) {
    appEl.innerHTML =
      '<div class="flash err">' + esc(msg) + '</div>' +
      '<button class="btn-ghost" id="retry">重试</button>';
    document.getElementById("retry").onclick = function () { bootstrap(); };
  }

  function loading(count) {
    var html = "";
    for (var i = 0; i < count; i++) { html += '<div class="skeleton"></div>'; }
    appEl.innerHTML = html;
  }

  function header(title, sub) {
    return '<p class="section-tip">' + esc(sub || "") + '</p>';
  }

  // ── 1 选科室 ────────────────────────────────────────────
  function renderDepartments() {
    setStep(0);
    loading(4);
    S = { dept: null, doctor: null, schedule: null };

    api("/api/mini/departments").then(function (res) {
      var list = res.data || [];
      if (!list.length) { fail("该院暂未配置科室"); return; }

      var html = header("", "请选择要就诊的科室");
      list.forEach(function (d) {
        html +=
          '<div class="card tap" data-id="' + esc(d.department_id) + '" data-name="' + esc(d.department_name) + '">' +
            '<div class="row">' +
              '<div class="grow">' +
                '<p class="name">' + esc(d.department_name) + '</p>' +
                '<p class="meta">科室编码 ' + esc(d.department_code) + '</p>' +
              '</div>' +
              '<span class="badge line">' + esc(d.doctor_count) + ' 位医生</span>' +
            '</div>' +
          '</div>';
      });
      appEl.innerHTML = html;
      bindCards("dept");
    }).catch(function (e) { fail(e.message); });
  }

  // ── 2 选医生 ────────────────────────────────────────────
  function renderDoctors(dept) {
    setStep(1);
    loading(3);
    S.dept = dept;
    S.doctor = null;
    S.schedule = null;

    api("/api/mini/doctors?department_id=" + encodeURIComponent(dept.id)).then(function (res) {
      var list = res.data || [];
      var html = '<p class="section-tip">' + esc(dept.name) + ' · 选择医生</p>';
      if (!list.length) {
        html += '<div class="flash">该科室当前没有排班医生，请返回换一个科室。</div>';
        html += '<button class="btn-ghost" id="back">返回选科室</button>';
        appEl.innerHTML = html;
        document.getElementById("back").onclick = renderDepartments;
        return;
      }
      list.forEach(function (d) {
        html +=
          '<div class="card tap" data-id="' + esc(d.doctor_id) + '" data-name="' + esc(d.doctor_name) + '" data-title="' + esc(d.title) + '" data-fee="' + esc(d.consultation_fee) + '">' +
            '<div class="row">' +
              '<div class="grow">' +
                '<p class="name">' + esc(d.doctor_name) + ' <span class="badge">' + esc(d.title) + '</span></p>' +
                '<p class="meta">专长：' + esc(d.specialty || "—") + ' · 工号 ' + esc(d.doctor_no) + '</p>' +
              '</div>' +
              '<div class="price">' + money(d.consultation_fee) + '</div>' +
            '</div>' +
          '</div>';
      });
      html += '<button class="btn-ghost" id="back">返回选科室</button>';
      appEl.innerHTML = html;
      document.getElementById("back").onclick = renderDepartments;
      bindCards("doctor");
    }).catch(function (e) { fail(e.message); });
  }

  // ── 3 选号源 ────────────────────────────────────────────
  function renderSchedules(doctor) {
    setStep(2);
    loading(4);
    S.doctor = doctor;
    S.schedule = null;

    api("/api/mini/schedules?doctor_id=" + encodeURIComponent(doctor.id) + "&days=7").then(function (res) {
      var list = res.data || [];
      var html = '<p class="section-tip">' + esc(doctor.name) + ' · 未来 7 天号源</p>';
      if (!list.length) {
        html += '<div class="flash">该医生近 7 天没有放号。</div>';
      }
      list.forEach(function (s) {
        var full = Number(s.remain) <= 0;
        html +=
          '<div class="card' + (full ? "" : " tap") + '" data-id="' + esc(s.schedule_id) + '" data-date="' + esc(s.work_date) + '" data-shift="' + esc(s.shift_type) + '" data-room="' + esc(s.clinic_room) + '" data-fee="' + esc(doctor.fee) + '"' + (full ? ' data-full="1"' : "") + '>' +
            '<div class="row">' +
              '<div class="grow">' +
                '<p class="name">' + esc(s.work_date) + ' <span class="badge">' + esc(s.shift_type) + '</span></p>' +
                '<p class="meta">' + esc(s.clinic_room) + ' 诊室 · 已挂 ' + esc(s.registered_count) + '/' + esc(s.max_registrations) + '</p>' +
              '</div>' +
              '<span class="badge' + (full ? "" : " dark") + '">' + (full ? "已满" : "余 " + esc(s.remain)) + '</span>' +
            '</div>' +
          '</div>';
      });
      html += '<button class="btn-ghost" id="back">返回选医生</button>';
      appEl.innerHTML = html;
      document.getElementById("back").onclick = function () { renderDoctors(S.dept); };
      bindSchedule();
    }).catch(function (e) { fail(e.message); });
  }

  // ── 4 填就诊人 ──────────────────────────────────────────
  function renderForm(schedule) {
    setStep(3);
    S.schedule = schedule;

    var html =
      '<p class="section-tip">' + esc(S.dept.name) + ' · ' + esc(S.doctor.name) + ' · ' + esc(schedule.date) + ' ' + esc(schedule.shift) + '</p>' +
      '<div class="card">' +
        '<div class="kv"><span>科室</span><b>' + esc(S.dept.name) + '</b></div>' +
        '<div class="kv"><span>医生</span><b>' + esc(S.doctor.name) + ' ' + esc(S.doctor.title) + '</b></div>' +
        '<div class="kv"><span>就诊时间</span><b>' + esc(schedule.date) + ' ' + esc(schedule.shift) + '</b></div>' +
        '<div class="kv"><span>挂号费</span><b>' + money(schedule.fee) + '</b></div>' +
      '</div>' +
      '<div class="card">' +
        '<div class="field"><label>姓名 <em>*</em></label><input id="f_name" placeholder="请输入就诊人姓名" autocomplete="off"></div>' +
        '<div class="field"><label>身份证号 <em>*</em></label><input id="f_idcard" placeholder="18 位身份证号" maxlength="18" autocomplete="off"></div>' +
        '<div class="field"><label>性别</label><select id="f_gender"><option>男</option><option>女</option></select></div>' +
        '<div class="field"><label>出生日期</label><input id="f_birth" type="date"></div>' +
        '<div class="field"><label>手机号</label><input id="f_phone" placeholder="用于接收就诊通知" maxlength="11" autocomplete="off"></div>' +
      '</div>' +
      '<button id="submit">确认挂号</button>' +
      '<div style="height:10px"></div>' +
      '<button class="btn-ghost" id="back">返回选时段</button>';

    appEl.innerHTML = html;
    document.getElementById("back").onclick = function () { renderSchedules(S.doctor); };
    document.getElementById("submit").onclick = submit;
  }

  function submit() {
    var name = document.getElementById("f_name").value.trim();
    var idcard = document.getElementById("f_idcard").value.trim().toUpperCase();
    var gender = document.getElementById("f_gender").value;
    var birth = document.getElementById("f_birth").value;
    var phone = document.getElementById("f_phone").value.trim();

    if (!name) { alert("请填写就诊人姓名"); return; }
    if (!/^\d{17}[\dX]$/.test(idcard)) { alert("身份证号应为 18 位，请检查"); return; }

    var btn = document.getElementById("submit");
    btn.disabled = true;
    btn.textContent = "正在挂号…";

    api("/api/mini/register", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        schedule_id: Number(S.schedule.id),
        reg_type: "普通号",
        pay_method: "微信",
        patient: {
          name: name, gender: gender,
          birth_date: birth || null,
          id_card: idcard, phone: phone
        }
      })
    }).then(function (res) {
      renderSuccess(res.data, res.msg);
    }).catch(function (e) {
      btn.disabled = false;
      btn.textContent = "确认挂号";
      alert(e.message);
    });
  }

  // ── 5 成功 ──────────────────────────────────────────────
  function renderSuccess(d, msg) {
    setStep(4);
    d = d || {};
    appEl.innerHTML =
      '<div class="card center">' +
        '<div class="badge dark">挂号成功</div>' +
        '<p class="big-code">' + esc(d.reg_no || "—") + '</p>' +
        '<p class="meta">挂号编号 · 请凭此号到院就诊</p>' +
      '</div>' +
      '<div class="card">' +
        '<div class="kv"><span>排队号</span><b>' + esc(d.queue_no || "—") + '</b></div>' +
        '<div class="kv"><span>实收挂号费</span><b>' + money(d.reg_fee) + '</b></div>' +
        '<div class="kv"><span>就诊状态</span><b>' + esc(d.visit_status || "待就诊") + '</b></div>' +
        '<div class="kv"><span>科室 / 医生</span><b>' + esc(S.dept.name) + ' · ' + esc(S.doctor.name) + '</b></div>' +
        '<div class="kv"><span>就诊时间</span><b>' + esc(S.schedule.date) + ' ' + esc(S.schedule.shift) + '</b></div>' +
      '</div>' +
      (msg ? '<div class="flash ok">' + esc(msg) + '</div>' : '') +
      '<div class="flash ok">这条挂号记录已写入医院门诊管理系统，可在「挂号管理」中查到。</div>' +
      '<button class="btn-ghost" id="again">再挂一个号</button>';

    document.getElementById("again").onclick = renderDepartments;
  }

  // ── 卡片事件绑定 ────────────────────────────────────────
  function bindCards(kind) {
    var cards = appEl.querySelectorAll(".card.tap");
    for (var i = 0; i < cards.length; i++) {
      (function (el) {
        el.onclick = function () {
          if (kind === "dept") {
            renderDoctors({ id: el.dataset.id, name: el.dataset.name });
          } else {
            renderSchedules({
              id: el.dataset.id, name: el.dataset.name,
              title: el.dataset.title, fee: el.dataset.fee
            });
          }
        };
      })(cards[i]);
    }
  }

  function bindSchedule() {
    var cards = appEl.querySelectorAll(".card.tap");
    for (var i = 0; i < cards.length; i++) {
      (function (el) {
        el.onclick = function () {
          renderForm({
            id: el.dataset.id, date: el.dataset.date, shift: el.dataset.shift,
            room: el.dataset.room, fee: el.dataset.fee
          });
        };
      })(cards[i]);
    }
  }

  // ── 入口 ────────────────────────────────────────────────
  function bootstrap() {
    // 页面加载瞬间还没拿到后端地址（initPage 由鸿蒙侧 onPageEnd 注入），
    // 此时先显示骨架屏，不要弹错误——否则会闪一下红框再跳走。
    if (!BASE) {
      loading(4);
      return;
    }
    renderDepartments();
  }

  /**
   * 由鸿蒙侧 onPageEnd 注入。
   * @param {string} base    医院后端地址，如 http://10.150.5.254:5000
   * @param {string} deptId  分诊结果的 HIS department_id，可为空
   * @param {string} deptName 科室中文名，仅用于展示
   */
  window.initPage = function (base, deptId, deptName) {
    BASE = String(base || "").replace(/\/+$/, "");
    if (deptId && String(deptId).length > 0) {
      // 分诊已经定了科室，直接跳到该科室的医生列表，省掉老人自己找科室
      renderDoctors({ id: String(deptId), name: String(deptName || "") });
    } else {
      renderDepartments();
    }
  };

  bootstrap();
})();
</script>
</body>
</html>
